<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Validação responsiva da marca lateral</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#00070b;color:#f6f8f7} body{overflow-x:auto}
  .app-shell{display:flex;min-width:1900px;min-height:100vh;background:radial-gradient(900px 480px at 14% -10%,rgba(18,183,106,.065),transparent 58%),linear-gradient(180deg,#00070b,#031014 68%,#010b0d)}
  .sidebar{position:sticky;left:0;top:0;z-index:40;display:flex;width:198px;height:100vh;flex:0 0 198px;flex-direction:column;overflow:hidden;border-right:1px solid rgba(110,195,156,.18);background:#010c0e;isolation:isolate}
  .client{position:relative;z-index:10;flex:none;padding:24px 28px 16px}.klabin{display:flex;align-items:flex-end;gap:6px;font-size:29px;font-weight:800;letter-spacing:-.05em}.dot{width:6px;height:6px;margin-bottom:6px;border-radius:50%;background:#37ed63;box-shadow:0 0 14px rgba(55,237,99,.7)}.sub{display:flex;align-items:center;gap:8px;margin-top:10px;color:rgba(55,237,99,.9);font-size:11px}.sub:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(16,184,102,.45),transparent)}
  .nav{position:relative;z-index:10;min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:8px 12px 12px}.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:rgba(55,237,99,.18);border-radius:999px}.item{position:relative;display:flex;min-height:54px;align-items:center;gap:12px;margin-bottom:8px;padding:8px 14px;border:1px solid transparent;border-radius:14px;color:#d1d9d6;font-size:12px;line-height:1.25}.item.active{border-color:rgba(16,184,102,.35);background:linear-gradient(90deg,rgba(9,69,47,.94),rgba(5,45,35,.8));color:white;box-shadow:0 0 22px rgba(18,183,106,.14)}.item.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:0 4px 4px 0;background:#37ed63;box-shadow:0 0 12px rgba(55,237,99,.9)}.icon{width:18px;height:18px;flex:none;border:1.5px solid currentColor;border-radius:5px}.item.active .icon{color:#37ed63}
  .forest{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;opacity:.48;background:radial-gradient(100% 90% at 50% 100%,rgba(12,99,56,.22),transparent 65%),linear-gradient(180deg,transparent,rgba(1,24,20,.88))}
  .footer{position:relative;z-index:10;flex:0 0 auto;padding:10px 12px 14px;border-top:1px solid rgba(110,195,156,.12);background:linear-gradient(180deg,rgba(1,12,14,.34),rgba(1,12,14,.96) 26%);box-shadow:0 -18px 30px rgba(0,7,9,.22)}.notes{display:grid;gap:8px}.note{padding:10px 12px;border:1px solid rgba(16,184,102,.24);border-radius:12px;background:linear-gradient(140deg,rgba(5,46,35,.86),rgba(3,25,23,.92));box-shadow:0 8px 20px rgba(0,0,0,.22);color:#d5dfdc;font-size:10px;line-height:1.35}.brand{display:flex;min-height:48px;align-items:center;justify-content:center;margin-top:10px;padding:9px 10px 7px;overflow:hidden;border:1px solid rgba(110,195,156,.13);border-radius:12px;background:linear-gradient(145deg,rgba(4,31,28,.82),rgba(2,18,19,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 8px 18px rgba(0,0,0,.2)}.brand img{display:block;width:min(100%,136px);height:auto;max-height:34px;object-fit:contain;opacity:.82;filter:drop-shadow(0 4px 10px rgba(0,0,0,.48))}
  .main{flex:1;padding:22px 24px}.top{height:88px;border:1px solid rgba(110,195,156,.15);border-radius:15px;background:#0d181d}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px}.card{height:150px;border:1px solid rgba(110,195,156,.15);border-radius:15px;background:linear-gradient(152deg,rgba(14,27,32,.97),rgba(7,18,23,.99));box-shadow:0 12px 34px rgba(0,0,0,.25)}.panels{display:grid;grid-template-columns:1.03fr 1.78fr 1.48fr;gap:14px;margin-top:14px}.panel{height:270px;border:1px solid rgba(110,195,156,.15);border-radius:15px;background:#0d181d}
  @media(max-height:850px) and (min-width:1024px){.client{padding-top:18px;padding-bottom:12px}.nav .item{min-height:46px;padding-top:6px;padding-bottom:6px;margin-bottom:4px}.footer{padding-top:8px;padding-bottom:10px}.notes{gap:6px}.note{padding:7px 9px;font-size:9px;line-height:1.3}.brand{min-height:42px;margin-top:8px;padding:7px 10px 5px}.brand img{width:min(100%,124px);max-height:30px}}
  @media(max-height:700px) and (min-width:1024px){.notes{display:none}.footer{padding-top:6px}.brand{margin-top:0}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-test="sidebar">
    <header class="client"><div class="klabin">Klabin<span class="dot"></span></div><div class="sub">●&nbsp; Operações</div></header>
    <nav class="nav" data-test="nav">
      <div class="item active"><span class="icon"></span>Visão Geral</div>
      <div class="item"><span class="icon"></span>Chamados e Atendimento</div>
      <div class="item"><span class="icon"></span>Climatização</div>
      <div class="item"><span class="icon"></span>Rondas e Preventivas</div>
      <div class="item"><span class="icon"></span>Evidências e Auditoria</div>
      <div class="item"><span class="icon"></span>Qualidade dos Dados</div>
      <div class="item"><span class="icon"></span>Relatórios</div>
      <div class="item"><span class="icon"></span>Assistente Operacional</div>
    </nav>
    <div class="forest"></div>
    <footer class="footer" data-test="footer">
      <div class="notes"><div class="note">♻ Sustentabilidade que nos move hoje e sempre.</div><div class="note">◇ Facility Management escrito com excelência.</div></div>
      <div class="brand" data-test="brand"><img src="../public/facilities-ai-logo.png" alt="Facilities AI"></div>
    </footer>
  </aside>
  <main class="main"><div class="top"></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div><div class="panels"><div class="panel"></div><div class="panel"></div><div class="panel"></div></div></main>
</div>
</body>
</html>
